<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>EduCore | Login</title>

        <link
            rel="stylesheet"
            href="../style/auth.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>

    <body>
        <main class="auth-page">
            <!-- Left Side -->
            <section class="auth-banner">
                <div class="logo">
                    <img
                        src="../assets/educore-logo.svg"
                        alt="EduCore Logo"
                    />
                    <h2>Edu<span>Core</span></h2>
                </div>
                <div class="banner-content">
                    <h1>
                        Your Learning Journey
                        <span>Starts Here</span>
                    </h1>

                    <div class="orange-line"></div>

                    <p>
                        Access your courses, track your progress, and achieve your goals — all in
                        one place.
                    </p>
                </div>
            </section>

            <!-- Right Side -->
            <section class="auth-form-section">
                <div class="auth-form-container">
                    <h2>Welcome Back</h2>
                    <p class="form-description">Sign in to your EduCore account</p>

                    <form id="loginForm">
                        <div class="input-group">
                            <label for="email">Email</label>

                            <div class="input-wrapper">
                                <i class="fa-regular fa-envelope input-icon"></i>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="Enter your email"
                                />
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="password">Password</label>

                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock input-icon"></i>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Enter your password"
                                />

                                <i
                                    class="fa-regular fa-eye password-toggle"
                                    id="togglePassword"
                                ></i>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input
                                    type="checkbox"
                                    id="rememberMe"
                                />
                                Remember me
                            </label>
                        </div>

                        <p
                            id="errorMessage"
                            class="error-message"
                        ></p>

                        <button
                            type="submit"
                            class="auth-btn"
                        >
                            Sign In
                        </button>
                    </form>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <p class="auth-switch">
                        Don't have an account?
                        <a href="./register.html">Create one</a>
                    </p>
                </div>
            </section>
        </main>

        <script
            type="module"
            src="../js/auth.js"
        ></script>
    </body>
</html>
