<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>EduCore | My Courses</title>

        <link
            rel="stylesheet"
            href="../style/dashboard.css"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>

    <body>
        <!-- ==============================
         Sidebar
    ============================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >
            <button
                class="sidebar-close"
                id="sidebarClose"
                type="button"
                aria-label="Close navigation menu"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="sidebar-logo">
                <img
                    src="../assets/educore-logo.svg"
                    alt="EduCore Logo"
                />
                <h2>Edu<span>Core</span></h2>
            </div>

            <nav class="sidebar-nav">
                <a
                    href="./dashboard.html"
                    class="nav-link"
                >
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a
                    href="./courses.html"
                    class="nav-link active"
                >
                    <i class="fa-solid fa-book-open"></i>
                    <span>My Courses</span>
                </a>

                <a
                    href="./grades.html"
                    class="nav-link"
                >
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Grades</span>
                </a>

                <a
                    href="./profile.html"
                    class="nav-link"
                >
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>
        </aside>

        <div
            class="sidebar-overlay"
            id="sidebarOverlay"
        ></div>

        <!-- ==============================
         Main Content
    ============================== -->

        <main class="main-content">
            <!-- Topbar -->

            <header class="topbar">
                <button
                    class="menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="topbar-title">
                    <h2>My Courses</h2>
                </div>

                <div class="topbar-user">
                    <div class="user-info">
                        <span
                            class="user-name"
                            id="topbarName"
                        >
                            Student Name
                        </span>

                        <span class="user-role"> Student </span>
                    </div>

                    <div class="user-avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <button
                        class="logout-btn"
                        id="logoutBtn"
                    >
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </header>

            <!-- ==============================
             Courses Content
        ============================== -->

            <section class="courses-page">
                <div class="page-heading">
                    <div>
                        <h1>My Courses</h1>
                        <p>View all the courses you are currently enrolled in.</p>
                    </div>

                    <div class="courses-total">
                        <span id="coursesTotal">0</span>
                        <p>Enrolled Courses</p>
                    </div>
                </div>

                <!-- Courses will be generated here -->

                <div
                    class="courses-grid"
                    id="coursesGrid"
                ></div>
            </section>
        </main>

        <script
            type="module"
            src="../js/courses.js"
        ></script>
        <script src="../js/sidebar.js"></script>
    </body>
</html>
